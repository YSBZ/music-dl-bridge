name: Publish music-dl bridge
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test bridge, ranking and web integration
        run: |
          go test ./core ./internal/web ./cmd/music-dl -count=1
          node --test tests/song-sort.test.cjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tags
        id: image
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "name=ghcr.io/ysbz/music-dl-bridge" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = tag ]; then
            echo "tags=ghcr.io/ysbz/music-dl-bridge:${REF_NAME#v},ghcr.io/ysbz/music-dl-bridge:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/ysbz/music-dl-bridge:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build candidate image locally on runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.bridge
          platforms: linux/amd64
          load: true
          tags: music-dl-bridge:verify
          labels: |
            org.opencontainers.image.source=https://github.com/YSBZ/music-dl-bridge
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify candidate container before publication
        run: bash tools/verify-bridge-image.sh music-dl-bridge:verify
      - name: Publish verified image
        env:
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
        run: |
          IFS=',' read -ra tags <<< "$IMAGE_TAGS"
          for tag in "${tags[@]}"; do
            docker tag music-dl-bridge:verify "$tag"
            docker push "$tag"
          done
